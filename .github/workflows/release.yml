name: Release Packages

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history so the development sync below can test ancestry.
          fetch-depth: 0

      - name: Verify successful CI commit is current main
        env:
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          test "$CI_HEAD_BRANCH" = "main"
          test "$CI_RUN_CONCLUSION" = "success"
          test "$(git rev-parse HEAD)" = "$CI_HEAD_SHA"
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "$CI_HEAD_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Verify npm for trusted publishing
        run: npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm release:version
          publish: pnpm release:publish
          commit: "Version packages"
          title: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync development with tested main
        env:
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/sync-tested-development.mjs
