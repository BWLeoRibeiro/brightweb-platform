packages:
  - "apps/*"
  - "packages/*"

overrides:
  next: 16.3.8
  "@next/mdx": 16.3.8
  postcss: 8.5.25
  nanoid: 3.3.18
  sharp: 0.35.5
  source-map-js: 1.2.2
  react: 19.2.4
  react-dom: 19.2.4
  geist: 1.7.2

# PostgreSQL binaries need packaged library symlinks restored after install.
onlyBuiltDependencies:
  - '@embedded-postgres/darwin-arm64'
  - '@embedded-postgres/darwin-x64'
  - '@embedded-postgres/linux-x64'
  - '@embedded-postgres/linux-arm64'
  - 'supabase'
